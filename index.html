function showExamForm(id = null) {
  (async () => {
    let exam = null;
    if (id) exam = await idbGet('examinations', id);
    const questions = (await idbGetAll('questions')).filter(q => q.status === 'published');
    const settings = await idbGet('settings', 'school');
    const selectedIds = new Set(exam?.questionIds || []);

    function deptLabel(subject) {
      const d = deptsForSubject(subject);
      const parts = [];
      if (d.science) parts.push('Science');
      if (d.arts) parts.push('Art');
      if (d.commercial) parts.push('Commercial');
      return parts.join(', ') || '—';
    }

    const bySubject = {};
    DEFAULT_SUBJECTS.forEach(s => { bySubject[s] = []; });
    bySubject['Other'] = [];
    questions.forEach(q => {
      const s = DEFAULT_SUBJECTS.includes(q.subject) ? q.subject : 'Other';
      bySubject[s].push(q);
    });
    const subjectsWithQ = DEFAULT_SUBJECTS.concat(['Other']).filter(s => (bySubject[s] || []).length > 0);

    const subjectBlocks = subjectsWithQ.map(sName => {
      const list = bySubject[sName];
      const selectedCount = list.filter(q => selectedIds.has(q.id)).length;
      const safe = encodeURIComponent(sName);
      const rows = list.map(q => `
        <label style="display:flex;gap:8px;align-items:flex-start;padding:4px 0;border-bottom:1px solid var(--gray-50)">
          <input type="checkbox" class="exam-q-check" data-subject="${escapeHtml(sName)}" value="${q.id}" ${selectedIds.has(q.id) ? 'checked' : ''} onchange="updateExamSubjectCounts()">
          <span class="text-sm">${escapeHtml((q.text || '').substring(0, 100))}${(q.text || '').length > 100 ? '…' : ''}
            <span class="text-muted">(${q.marks || 1}m)</span></span>
        </label>
      `).join('');
      return `
        <div class="panel" style="margin-bottom:10px">
          <div class="panel-header" style="padding:0.65rem 0.85rem;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
            <div>
              <strong>${escapeHtml(sName)}</strong>
              <span class="badge badge-neutral" style="margin-left:6px">${list.length} available</span>
              <span class="badge badge-teal exam-sub-count" data-count-for="${escapeHtml(sName)}" style="margin-left:4px">${selectedCount} selected</span>
              <div class="text-sm text-muted">Counts toward: ${escapeHtml(deptLabel(sName))}</div>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <button type="button" class="btn btn-sm btn-primary" onclick="examSelectSubject(decodeURIComponent('${safe}'), true)">Select all</button>
              <button type="button" class="btn btn-sm btn-outline" onclick="examSelectSubject(decodeURIComponent('${safe}'), false)">Clear</button>
            </div>
          </div>
          <div class="panel-body" style="padding:0.5rem 0.85rem;max-height:160px;overflow-y:auto">
            ${rows || '<p class="text-sm text-muted">No questions</p>'}
          </div>
        </div>
      `;
    }).join('');

    showModal(id ? 'Edit Examination' : 'Create Examination', `
      <div class="form-group">
        <label>Title <span class="req">*</span></label>
        <input class="form-control" id="eTitle" value="${escapeHtml(exam?.title || settings?.examTitleDefault || 'SS1 Department Placement Test')}">
      </div>
      <div class="form-group">
        <label>Instructions</label>
        <textarea class="form-control" id="eInstr" rows="2">${escapeHtml(exam?.instructions || settings?.examInstructions || '')}</textarea>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label>Duration (minutes)</label>
          <input type="number" class="form-control" id="eDuration" value="${exam?.durationMinutes ?? settings?.defaultDurationMinutes ?? 60}" min="5" max="300">
        </div>
        <div class="form-group">
          <label>Randomise within each subject</label>
          <select class="form-control" id="eRandQ">
            <option value="true" ${exam?.randomiseQuestions !== false ? 'selected' : ''}>Yes</option>
            <option value="false" ${exam?.randomiseQuestions === false ? 'selected' : ''}>No</option>
          </select>
          <div class="form-hint">Subject order stays fixed (Math → English → …). Only order inside a subject is shuffled.</div>
        </div>
        <div class="form-group">
          <label>Randomise Options</label>
          <select class="form-control" id="eRandO">
            <option value="true" ${exam?.randomiseOptions !== false ? 'selected' : ''}>Yes</option>
            <option value="false" ${exam?.randomiseOptions === false ? 'selected' : ''}>No</option>
          </select>
        </div>
        <div class="form-group">
          <label>Allow Backward Navigation</label>
          <select class="form-control" id="eBack">
            <option value="true" ${exam?.allowBack !== false ? 'selected' : ''}>Yes</option>
            <option value="false" ${exam?.allowBack === false ? 'selected' : ''}>No</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Questions by subject <span id="examTotalSelected" class="badge badge-teal">${selectedIds.size} selected</span></label>
        <p class="text-sm text-muted mb-1">Choose questions under each subject. Placement uses: Science / Art / Commercial weights from the subject map.</p>
        <div style="max-height:340px;overflow-y:auto;padding-right:4px">
          ${subjectsWithQ.length === 0
            ? '<div class="empty-state"><p>No published questions yet. Publish questions in the Question Bank first.</p></div>'
            : subjectBlocks}
        </div>
      </div>
    `, [
      { label: 'Cancel', class: 'btn-outline', onClick: closeModal },
      { label: id ? 'Save Examination' : 'Create Examination', class: 'btn-primary', onClick: () => saveExam(id) }
    ]);
    document.querySelector('.modal')?.classList.add('modal-lg');
  })();
}

function examSelectSubject(subjectName, checked) {
  document.querySelectorAll('.exam-q-check').forEach(cb => {
    if (cb.getAttribute('data-subject') === subjectName) cb.checked = !!checked;
  });
  updateExamSubjectCounts();
}

function updateExamSubjectCounts() {
  const totals = {};
  document.querySelectorAll('.exam-q-check').forEach(cb => {
    const s = cb.getAttribute('data-subject') || 'Other';
    if (!totals[s]) totals[s] = { all: 0, on: 0 };
    totals[s].all++;
    if (cb.checked) totals[s].on++;
  });
  document.querySelectorAll('.exam-sub-count').forEach(el => {
    const s = el.getAttribute('data-count-for');
    const t = totals[s] || { on: 0 };
    el.textContent = t.on + ' selected';
  });
  const total = document.querySelectorAll('.exam-q-check:checked').length;
  const totEl = document.getElementById('examTotalSelected');
  if (totEl) totEl.textContent = total + ' selected';
}

async function saveExam(id) {
  const title = document.getElementById('eTitle').value.trim();
  const instructions = document.getElementById('eInstr').value.trim();
  const durationMinutes = parseInt(document.getElementById('eDuration').value, 10) || 60;
  const randomiseQuestions = document.getElementById('eRandQ').value === 'true';
  const randomiseOptions = document.getElementById('eRandO').value === 'true';
  const allowBack = document.getElementById('eBack').value === 'true';
  const questionIds = [...document.querySelectorAll('.exam-q-check:checked')].map(c => c.value);

  if (!title) { toast('Title is required.', 'error'); return; }
  if (questionIds.length === 0) { toast('Select at least one question.', 'error'); return; }

  try {
    if (id) {
      const existing = await idbGet('examinations', id);
      Object.assign(existing, { title, instructions, durationMinutes, randomiseQuestions, randomiseOptions, allowBack, questionIds, updatedAt: now() });
      await idbPut('examinations', existing);
      await logActivity('exam_update', `Updated examination: ${title}`, id);
      toast('Examination updated.', 'success');
    } else {
      const exam = {
        id: uid(),
        title,
        instructions,
        durationMinutes,
        randomiseQuestions,
        randomiseOptions,
        allowBack,
        allowEarlySubmit: true,
        questionIds,
        status: 'draft',
        createdAt: now(),
        updatedAt: now()
      };
      await idbPut('examinations', exam);
      await logActivity('exam_create', `Created examination: ${title}`, exam.id);
      toast('Examination created.', 'success');
    }
    closeModal();
    loadExams();
  } catch (err) {
    toast('Error: ' + err.message, 'error');
  }
}

async function toggleExamStatus(id) {
  const exam = await idbGet('examinations', id);
  if (exam.status !== 'published' && (!exam.questionIds || exam.questionIds.length === 0)) {
    toast('Cannot publish an examination with no questions.', 'error');
    return;
  }
  exam.status = exam.status === 'published' ? 'draft' : 'published';
  exam.updatedAt = now();
  await idbPut('examinations', exam);
  await logActivity('exam_status', `${exam.status} examination: ${exam.title}`, id);
  toast(`Examination ${exam.status}.`, 'success');
  loadExams();
}

async function manageAnswerKey(examId) {
  const exam = await idbGet('examinations', examId);
  if (!exam) { toast('Examination not found.', 'error'); return; }
  const allQ = await idbGetAll('questions');
  const qMap = Object.fromEntries(allQ.map(q => [q.id, q]));
  const ids = exam.questionIds || [];

  const guide = `
    <div class="panel" style="margin-bottom:12px;border-left:4px solid var(--teal)">
      <div class="panel-body" style="padding:12px 14px">
        <h3 style="font-size:0.95rem;margin-bottom:6px">How the answer key is used for grading</h3>
        <ol class="text-sm" style="margin-left:1.2rem;line-height:1.55">
          <li>Set the correct option (A–D) for each question below, then click <strong>Save Answer Key</strong>.</li>
          <li>Answers are stored only on this teacher computer (question bank).</li>
          <li>Export the <strong>student exam package</strong> — it does <em>not</em> include answers.</li>
          <li>Students take the test on lab computers and you collect <strong>response files</strong> via USB.</li>
          <li>On this master computer, use <strong>Import &amp; Export → Import responses</strong>. The system marks each answer against this key and computes Science / Arts / Commercial placement scores.</li>
        </ol>
      </div>

  if (!ids.length) {
    showModal('Answer Key — ' + (exam.title || 'Examination'), guide + `
      <div class="empty-state">
        <h4>No questions in this examination yet</h4>
        <p>Add questions to the bank, then edit this examination to select them — or add a new question now.</p>
        <button class="btn btn-primary mt-1" onclick="closeModal();showQuestionForm()">+ Add New Question</button>
      </div>
    `, [
      { label: 'Close', class: 'btn-outline', onClick: closeModal },
      { label: '+ Add Question', class: 'btn-primary', onClick: () => { closeModal(); showQuestionForm(); } }
    ]);
    return;
  }

  const rows = ids.map((qid, i) => {
    const q = qMap[qid];
    if (!q) {
      return '<div class="panel" style="margin-bottom:10px"><div class="panel-body text-muted">Question ' + (i+1) + ' missing from bank</div></div>';
    }
    const ci = typeof q.correctIndex === 'number' ? q.correctIndex : 0;
    const opts = (q.options || []).map((o, oi) => {
      const letter = String.fromCharCode(65 + oi);
      const checked = ci === oi ? 'checked' : '';
      return '<label class="radio-label" style="display:flex;align-items:flex-start;gap:8px;margin:6px 0;padding:8px 10px;border:1px solid var(--gray-100);border-radius:8px;cursor:pointer">' +
        '<input type="radio" name="ak_' + q.id + '" value="' + oi + '" ' + checked + ' style="margin-top:3px">' +
        '<span><strong>' + letter + '.</strong> ' + escapeHtml(o || '(empty)') + '</span></label>';
    }).join('');
    return '<div class="panel" style="margin-bottom:10px" data-qid="' + q.id + '">' +
      '<div class="panel-header" style="padding:0.75rem 1rem"><h3 style="font-size:0.95rem">Q' + (i+1) + '. ' + escapeHtml((q.text || '').slice(0, 140)) + ((q.text||'').length > 140 ? '…' : '') + '</h3></div>' +
      '<div class="panel-body" style="padding:0.75rem 1rem">' +
      '<p class="text-sm text-muted mb-1">Subject: ' + escapeHtml(q.subject || '—') + ' · Choose the correct answer:</p>' +
      opts +
      '</div></div>';
  }).join('');

  showModal('Answer Key — ' + (exam.title || 'Examination'), guide + `
    <div class="toolbar" style="margin-bottom:10px">
      <button type="button" class="btn btn-primary btn-sm" onclick="closeModal();showQuestionForm()">+ Add New Question</button>
      <span class="text-sm text-muted">New questions are added to the bank. Edit the examination to include them in this test.</span>
    </div>
    <div id="answerKeyList" style="max-height:55vh;overflow-y:auto">${rows}</div>
  `, [
    { label: 'Cancel', class: 'btn-outline', onClick: closeModal },
    { label: 'Generate PDF Answer Key', class: 'btn-outline', onClick: () => generatePdfAnswerKey(examId) },
    { label: 'Save Answer Key', class: 'btn-primary', onClick: () => saveAnswerKey(examId) }
  ]);
}

async function saveAnswerKey(examId) {
  const exam = await idbGet('examinations', examId);
  if (!exam) return;
  const ids = exam.questionIds || [];
  let updated = 0;
  for (const qid of ids) {
    const radios = document.querySelectorAll('input[name="ak_' + qid + '"]');
    if (!radios.length) continue;
    let selected = null;
    radios.forEach(r => { if (r.checked) selected = parseInt(r.value, 10); });
    if (selected == null || isNaN(selected)) continue;
    const q = await idbGet('questions', qid);
    if (!q) continue;
    if (q.correctIndex !== selected) {
      q.correctIndex = selected;
      q.updatedAt = now();
      await idbPut('questions', q);
      updated++;
    } else {
      // still count as confirmed
      updated++;
    }
  }
  await logActivity('answer_key', 'Saved answer key for exam: ' + (exam.title || examId) + ' (' + updated + ' questions)', examId);
  toast('Answer key saved for ' + updated + ' question(s).', 'success');
  closeModal();
  loadExams();
}

async function exportStudentExamPackage(examId) {
  const exam = await idbGet('examinations', examId);
  if (!exam || exam.status !== 'published') {
    toast('Only published examinations can be exported for students.', 'error');
    return;
  }
  const allQuestions = await idbGetAll('questions');
  const qMap = Object.fromEntries(allQuestions.map(q => [q.id, q]));

  const packageQuestions = exam.questionIds.map(qid => {
    const q = qMap[qid];
    if (!q) return null;
    // CRITICAL: strip answer key, explanation, department weights
    return {
      id: q.id,
      text: q.text,
      options: [...q.options],
      marks: q.marks,
      subject: q.subject
      // NO correctIndex, NO explanation, NO departmentWeights
    };
  }).filter(Boolean);

  const pkg = {
    schemaVersion: SCHEMA_VERSION,
    packageType: 'student_examination',
    exportTimestamp: now(),
    examination: {
      id: exam.id,
      title: exam.title,
      instructions: exam.instructions,
      durationMinutes: exam.durationMinutes,
      randomiseQuestions: exam.randomiseQuestions,
      randomiseOptions: exam.randomiseOptions,
      allowBack: exam.allowBack,
      allowEarlySubmit: exam.allowEarlySubmit !== false
    },
    questions: packageQuestions
  };

  downloadJSON(`exam-package-${exam.id.slice(0,8)}-${new Date().toISOString().slice(0,10)}.json`, pkg);
  await logActivity('export', `Exported student exam package: ${exam.title}`, examId);
  toast('Student examination package exported (no answer key included).', 'success');
}

function importRosterPackage() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = async () => {
    try {
      const text = await readFileAsText(input.files[0]);
      const pkg = JSON.parse(text);
      if (pkg.packageType !== 'student_roster') { toast('Not a student roster package.', 'error'); return; }
      let added = 0, updated = 0;
      for (const s of pkg.students || []) {
        const existing = await idbGetByIndex('students', 'admissionNumber', s.admissionNumber);
        if (existing) {
          // update non-credential fields only if needed
          updated++;
        } else {
          await idbPut('students', { ...s, id: s.id || uid(), createdAt: s.createdAt || now(), updatedAt: now() });
          added++;
        }
      }
      await logActivity('import', `Roster import: ${added} added, ${updated} existing`);
      toast(`Roster imported: ${added} new, ${updated} already present.`, 'success');
    } catch (err) {
      toast('Import failed: ' + err.message, 'error');
    }
  };
  input.click();
}

function importResponseFiles() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.multiple = true;
  input.onchange = async () => {
    let accepted = 0, duplicates = 0, rejected = 0, conflicts = 0;
    const conflictDetails = [];

    for (const file of input.files) {
      try {
        const text = await readFileAsText(file);
        const pkg = JSON.parse(text);
        if (pkg.packageType !== 'student_responses') {
          rejected++;
          continue;
        }
        for (const r of pkg.responses || []) {
          // Check for existing attempt
          const existingAttempts = await idbGetAllByIndex('attempts', 'studentExam', [r.studentId, r.examId]);
          const sameId = existingAttempts.find(a => a.id === r.attemptId);
          if (sameId && sameId.status === 'graded') {
            duplicates++;
            continue;
          }
          if (sameId && sameId.status === 'submitted' && r.status === 'submitted') {
            // potential conflict — keep the earlier submission unless teacher decides
            conflicts++;
            conflictDetails.push(`${r.admissionNumber || r.studentId}: duplicate submission`);
            continue;
          }

          // Grade using master answer key
          const graded = await gradeAttempt(r);
          accepted++;
        }
      } catch (err) {
        console.error(err);
        rejected++;
      }
    }

    await logActivity('import', `Response import: ${accepted} accepted, ${duplicates} dup, ${conflicts} conflict, ${rejected} rejected`);
    let msg = `Import complete: ${accepted} accepted, ${duplicates} duplicates, ${conflicts} conflicts, ${rejected} rejected.`;
    if (conflictDetails.length) msg += ' Conflicts require teacher review.';
    toast(msg, accepted > 0 ? 'success' : 'warning');
    if (state.view === 'results') loadResults();
  };
  input.click();
}

async function gradeAttempt(responseData) {
  const exam = await idbGet('examinations', responseData.examId);
  if (!exam) throw new Error('Examination not found on master');

  const allQuestions = await idbGetAll('questions');
  const qMap = Object.fromEntries(allQuestions.map(q => [q.id, q]));
  const settings = await idbGet('settings', 'school');
  const scoring = settings?.scoring || DEFAULT_SETTINGS.scoring;

  let rawMarks = 0;
  let totalMarks = 0;
  const deptScores = { science: 0, arts: 0, commercial: 0 };
  const deptMax = { science: 0, arts: 0, commercial: 0 };
  let relevantCount = { science: 0, arts: 0, commercial: 0 };

  const questionIds = exam.questionIds || [];
  for (const qid of questionIds) {
    const q = qMap[qid];
    if (!q || q.correctIndex === undefined) continue; // skip if no answer key
    const marks = q.marks || 1;
    totalMarks += marks;
    const studentAnswer = responseData.answers?.[qid];
    const isCorrect = studentAnswer !== undefined && studentAnswer === q.correctIndex;
    if (isCorrect) rawMarks += marks;

    const w = q.departmentWeights || { science: 0, arts: 0, commercial: 0 };
    for (const d of ['science', 'arts', 'commercial']) {
      if (w[d] > 0) {
        deptMax[d] += marks * w[d];
        relevantCount[d]++;
        if (isCorrect) deptScores[d] += marks * w[d];
      }
    }
  }

  const overallPercent = totalMarks > 0 ? (rawMarks / totalMarks) * 100 : 0;
  const norm = {};
  for (const d of ['science', 'arts', 'commercial']) {
    norm[d] = deptMax[d] > 0 ? (deptScores[d] / deptMax[d]) * 100 : 0;
  }

  // Recommendation logic
  const sorted = Object.entries(norm).sort((a, b) => b[1] - a[1]);
  const topDept = sorted[0][0];
  const topScore = sorted[0][1];
  const secondScore = sorted[1][1];
  let reviewRequired = false;
  let recommendation = topDept.charAt(0).toUpperCase() + topDept.slice(1);
  let reason = '';

  if (overallPercent < scoring.minOverallPercent) {
    reviewRequired = true;
    reason = `Overall score ${overallPercent.toFixed(1)}% below minimum ${scoring.minOverallPercent}%`;
  } else if (topScore < scoring.minDepartmentScore) {
    reviewRequired = true;
    reason = `Top department score ${topScore.toFixed(1)}% below minimum ${scoring.minDepartmentScore}%`;
  } else if ((topScore - secondScore) < scoring.borderlineDifference) {
    reviewRequired = true;
    reason = `Borderline: top two departments differ by only ${(topScore - secondScore).toFixed(1)}%`;
  } else if (relevantCount[topDept] < scoring.insufficientEvidenceMinQuestions) {
    reviewRequired = true;
    reason = `Insufficient evidence: only ${relevantCount[topDept]} relevant questions for ${recommendation}`;
  }

  if (reviewRequired) recommendation = 'Teacher Review Required';

  const student = await idbGet('students', responseData.studentId);
  const attempt = {
    id: responseData.attemptId || uid(),
    studentId: responseData.studentId,
    admissionNumber: responseData.admissionNumber || student?.admissionNumber,
    studentName: student?.fullName || '',
    examId: responseData.examId,
    examTitle: exam.title,
    answers: responseData.answers,
    status: 'graded',
    startTime: responseData.startTime,
    submitTime: responseData.submitTime || now(),
    timeExpired: responseData.timeExpired || false,
    rawMarks,
    totalMarks,
    overallPercent: Math.round(overallPercent * 10) / 10,
    departmentScores: {
      science: Math.round(norm.science * 10) / 10,
      arts: Math.round(norm.arts * 10) / 10,
      commercial: Math.round(norm.commercial * 10) / 10
    },
    recommendation,
    reviewRequired,
    reviewReason: reason,
    finalPlacement: null,
    overrideReason: null,
    gradedAt: now(),
    createdAt: responseData.startTime || now(),
    updatedAt: now()
  };

  await idbPut('attempts', attempt);
  return attempt;
}

// -------------------- Full Backup --------------------
async function createFullBackup() {
  const stores = ['settings', 'users', 'students', 'questions', 'examinations', 'attempts', 'responses', 'activityLog', 'subjects', 'remarkRequests'];
  const data = { schemaVersion: SCHEMA_VERSION, packageType: 'teacher_master_backup', exportTimestamp: now(), appVersion: APP_VERSION };
  for (const s of stores) {
    data[s] = await idbGetAll(s);
    if (s === 'users' || s === 'students') {
      data[s] = data[s].map(record => {
        const safe = { ...record };
        delete safe.passwordPlain;
        return safe;
      });
    }
  }
  downloadJSON(`LSMC-master-backup-${new Date().toISOString().slice(0,10)}.json`, data);
  await logActivity('backup', 'Created full master backup');
  toast('Full backup created. Store this file securely.', 'success');
}

function restoreFromBackup() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = async () => {
    try {
      const text = await readFileAsText(input.files[0]);
      const pkg = JSON.parse(text);
      if (pkg.packageType !== 'teacher_master_backup') {
        toast('Not a valid master backup file.', 'error');
        return;
      }
      confirmAction('Restoring will replace ALL current data. A safety backup of the current state will be created first. Continue?', async () => {
        // Safety backup first
        await createFullBackup();
        const stores = ['settings', 'users', 'students', 'questions', 'examinations', 'attempts', 'responses', 'activityLog', 'subjects', 'remarkRequests'];
        for (const s of stores) {
          await idbClear(s);
          for (const rec of pkg[s] || []) {
            const safe = { ...rec };
            if (s === 'users' || s === 'students') delete safe.passwordPlain;
            await idbPut(s, safe);
          }
        }
        await logActivity('restore', 'Restored from master backup');
        toast('Restore complete. Please log in again.', 'success');
        logout();
      });
    } catch (err) {
      toast('Restore failed: ' + err.message, 'error');
    }
  };
  input.click();
}

async function exportResultsCSV() {

function renderAnalytics() {
  return '<div id="analyticsContent"><div class="empty-state"><p>Loading analytics...</p></div></div>';
}

async function loadAnalytics() {
  const el = document.getElementById('analyticsContent');
  if (!el) return;
  const attempts = (await idbGetAll('attempts')).filter(a => a.status === 'submitted' || a.status === 'graded');
  const graded = attempts.filter(a => a.scores || a.overallPercent != null);
  const students = await idbGetAll('students');
  const deptCounts = { Science: 0, Arts: 0, Commercial: 0, Pending: 0, Review: 0 };
  let sumOverall = 0, sumSci = 0, sumArts = 0, sumCom = 0, n = 0;
  const bands = { '0-39': 0, '40-49': 0, '50-59': 0, '60-69': 0, '70-79': 0, '80-100': 0 };
  graded.forEach(a => {
    const place = a.finalPlacement || a.recommendation;
    if (a.reviewRequired && !a.finalPlacement) deptCounts.Review++;
    else if (place === 'Science') deptCounts.Science++;
    else if (place === 'Arts') deptCounts.Arts++;
    else if (place === 'Commercial') deptCounts.Commercial++;
    else deptCounts.Pending++;
    const p = a.overallPercent != null ? a.overallPercent : (a.scores && a.scores.overall);
    if (p != null) {
      sumOverall += p; n++;
      if (p < 40) bands['0-39']++;
      else if (p < 50) bands['40-49']++;
      else if (p < 60) bands['50-59']++;
      else if (p < 70) bands['60-69']++;
      else if (p < 80) bands['70-79']++;
      else bands['80-100']++;
    }
    if (a.scores) {
      sumSci += a.scores.science || 0;
      sumArts += a.scores.arts || 0;
      sumCom += a.scores.commercial || 0;
    }
  });
  const avg = n ? Math.round(sumOverall / n * 10) / 10 : 0;
  const avgSci = n ? Math.round(sumSci / n * 10) / 10 : 0;
  const avgArts = n ? Math.round(sumArts / n * 10) / 10 : 0;
  const avgCom = n ? Math.round(sumCom / n * 10) / 10 : 0;
  const maxBand = Math.max(...Object.values(bands), 1);
  const maxDept = Math.max(deptCounts.Science, deptCounts.Arts, deptCounts.Commercial, 1);
  el.innerHTML = `
    <div class="toolbar">
      <button class="btn btn-primary" onclick="printAnalyticsReport()">Print Analytics Report</button>
      <button class="btn btn-outline" onclick="printPlacementList()">Print Placement List</button>
      <button class="btn btn-outline" onclick="printClassResults()">Print Class Results</button>
      <button class="btn btn-outline" onclick="exportResultsCSV()">Export CSV</button>
    </div>
    <div class="cards-grid">
      <div class="stat-card accent"><div class="label">Graded Attempts</div><div class="value">${graded.length}</div><div class="sub">${students.length} students on roster</div></div>
      <div class="stat-card accent-teal"><div class="label">Average Overall</div><div class="value">${avg}%</div><div class="sub">Across graded attempts</div></div>
      <div class="stat-card"><div class="label">Science Avg</div><div class="value">${avgSci}%</div></div>
      <div class="stat-card"><div class="label">Arts Avg</div><div class="value">${avgArts}%</div></div>
      <div class="stat-card"><div class="label">Commercial Avg</div><div class="value">${avgCom}%</div></div>
    </div>
    <div class="cards-grid">
      <div class="panel">
        <div class="panel-header"><h3>Department Placement Distribution</h3></div>
        <div class="panel-body">
          ${['Science','Arts','Commercial'].map(d => {
            const c = deptCounts[d];
            const pct = Math.round(c / maxDept * 100);
            return '<div style="margin-bottom:12px"><div class="flex justify-between text-sm mb-1"><span class="font-bold">' + d + '</span><span>' + c + '</span></div><div class="exam-progress-bar"><div style="width:' + pct + '%"></div></div></div>';
          }).join('')}
          <p class="text-sm text-muted mt-1">Pending: ${deptCounts.Pending} · Teacher review: ${deptCounts.Review}</p>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header"><h3>Overall Score Bands</h3></div>
        <div class="panel-body">
          ${Object.entries(bands).map(([band, c]) => {
            const pct = Math.round(c / maxBand * 100);
            return '<div style="margin-bottom:10px"><div class="flex justify-between text-sm mb-1"><span>' + band + '%</span><span>' + c + '</span></div><div class="exam-progress-bar"><div style="width:' + pct + '%"></div></div></div>';
          }).join('')}
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header"><h3>Quick Insights</h3></div>
      <div class="panel-body text-sm">
        <p>${deptCounts.Science} Science · ${deptCounts.Arts} Arts · ${deptCounts.Commercial} Commercial · ${deptCounts.Review} need review.</p>
        <p class="mt-1 text-muted">Use print buttons for formal reports. Data is local to this computer.</p>
      </div>
    </div>
  `;
}

async function loadRanks() {
  const el = document.getElementById('ranksContent');
  if (!el) return;
  const attempts = (await idbGetAll('attempts')).filter(a => (a.status === 'submitted' || a.status === 'graded') && (a.overallPercent != null || a.scores));
  const sortBy = (state.filters && state.filters.rankSort) || 'overall';
  const sorted = attempts.slice().sort((a, b) => {
    const scoreOf = (x) => {
      if (sortBy === 'science') return (x.scores && x.scores.science) || 0;
      if (sortBy === 'arts') return (x.scores && x.scores.arts) || 0;
      if (sortBy === 'commercial') return (x.scores && x.scores.commercial) || 0;
      return x.overallPercent != null ? x.overallPercent : ((x.scores && x.scores.overall) || 0);
    };
    return scoreOf(b) - scoreOf(a);
  });
  el.innerHTML = `
    <div class="toolbar">
      <label class="text-sm">Rank by:</label>
      <select class="form-control" style="width:auto;min-width:160px" onchange="state.filters.rankSort=this.value;loadRanks()">
        <option value="overall" ${sortBy==='overall'?'selected':''}>Overall %</option>

async function printRanks() {

  const sorted = attempts.slice().sort((a,b) => (b.overallPercent||0)-(a.overallPercent||0));
  const settings = await idbGet('settings', 'school') || DEFAULT_SETTINGS;

  const rows = sorted.map((a,i) => {

    return '<tr><td>' + (i+1) + '</td><td>' + escapeHtml(a.admissionNumber||'') + '</td><td>' + escapeHtml(a.studentName||'') + '</td><td>' + (sc.science!=null?sc.science:'—') + '</td><td>' + (sc.arts!=null?sc.arts:'—') + '</td><td>' + (sc.commercial!=null?sc.commercial:'—') + '</td><td>' + (a.overallPercent!=null?a.overallPercent:(sc.overall!=null?sc.overall:'—')) + '%</td><td>' + escapeHtml(a.finalPlacement||a.recommendation||'—') + '</td></tr>';

}

async function showNewRemarkForm() {
  const attempts = (await idbGetAll('attempts')).filter(a => a.status === 'submitted' || a.status === 'graded');
  if (!attempts.length) { toast('No graded/submitted attempts available.', 'warning'); return; }
  const opts = attempts.map(a => '<option value="' + a.id + '">' + escapeHtml(a.admissionNumber) + ' — ' + escapeHtml(a.studentName) + ' (' + (a.overallPercent!=null?a.overallPercent+'%':'ungraded') + ')</option>').join('');
  showModal('New Remark Request', '<div class="form-group"><label>Student Attempt <span class="req">*</span></label><select class="form-control" id="rmAttempt">' + opts + '</select></div><div class="form-group"><label>Reason <span class="req">*</span></label><textarea class="form-control" id="rmReason" rows="3" placeholder="Why is a remark requested?"></textarea></div>', [
    { label: 'Cancel', class: 'btn-outline', onClick: closeModal },
    { label: 'Submit Request', class: 'btn-primary', onClick: async () => {
      const attemptId = document.getElementById('rmAttempt').value;
      const reason = document.getElementById('rmReason').value.trim();
      if (!reason) { toast('Reason is required.', 'error'); return; }
      const a = await idbGet('attempts', attemptId);
      const rec = { id: uid(), attemptId, studentId: a && a.studentId, studentName: a && a.studentName, admissionNumber: a && a.admissionNumber, reason, status: 'pending', createdAt: now(), createdBy: (state.currentUser && state.currentUser.username) || 'teacher', resolutionNote: null, resolvedAt: null };
      await idbPut('remarkRequests', rec);

      closeModal();
      loadRemarks();

async function resolveRemark(id, status) {
  const r = await idbGet('remarkRequests', id);
  if (!r) return;
  showModal(status === 'resolved' ? 'Resolve Remark' : 'Reject Remark', '<p class="mb-2">Student: <strong>' + escapeHtml(r.studentName||'') + '</strong> (' + escapeHtml(r.admissionNumber||'') + ')</p><p class="text-sm text-muted mb-2">' + escapeHtml(r.reason||'') + '</p><div class="form-group"><label>Resolution note</label><textarea class="form-control" id="rmNote" rows="2" placeholder="Optional note"></textarea></div>', [
    { label: 'Cancel', class: 'btn-outline', onClick: closeModal },
    { label: status === 'resolved' ? 'Mark Resolved' : 'Reject', class: status === 'resolved' ? 'btn-success' : 'btn-danger', onClick: async () => {
      r.status = status;
      r.resolutionNote = document.getElementById('rmNote').value.trim() || null;
      r.resolvedAt = now();
      r.resolvedBy = (state.currentUser && state.currentUser.username) || 'teacher';
      await idbPut('remarkRequests', r);
      await logActivity('remark_' + status, 'Remark ' + status + ' for ' + r.admissionNumber, id);
      toast('Remark ' + status + '.', 'success');
      closeModal();
      loadRemarks();
    }}
  ]);
}

async function viewRemark(id) {
  const r = await idbGet('remarkRequests', id);

  const a = r.attemptId ? await idbGet('attempts', r.attemptId) : null;

async function saveSettings() {

  settings.schoolName = document.getElementById('setSchoolName').value.trim();
  settings.schoolMotto = document.getElementById('setMotto')?.value?.trim() || '';
  settings.examTitleDefault = document.getElementById('setExamTitle').value.trim();
  settings.defaultDurationMinutes = parseInt(document.getElementById('setDuration').value, 10) || 60;
  settings.examInstructions = document.getElementById('setInstr').value.trim();
  settings.subjects = document.getElementById('setSubjects').value.split(',').map(s => s.trim()).filter(Boolean);
  settings.scoring = {
    minOverallPercent: parseFloat(document.getElementById('setMinOverall').value) || 40,
    minDepartmentScore: parseFloat(document.getElementById('setMinDept').value) || 45,
    borderlineDifference: parseFloat(document.getElementById('setBorderline').value) || 8,
    insufficientEvidenceMinQuestions: parseInt(document.getElementById('setMinQ').value, 10) || 3
  };
  // Logo file
  const logoInput = document.getElementById('setLogoFile');
  if (logoInput && logoInput.files && logoInput.files[0]) {

    if (file.size > 500000) { toast('Logo must be under 500 KB.', 'error'); return; }
    const reader = new FileReader();
    const dataUrl = await new Promise((res, rej) => { reader.onload = () => res(reader.result); reader.onerror = rej; reader.readAsDataURL(file); });
    settings.schoolLogo = dataUrl;
  }
  settings.updatedAt = now();
  await idbPut('settings', settings);

  toast('Settings saved.', 'success');

async function changeTeacherPassword() {
  const current = document.getElementById('pwCurrent').value;
  const newPw = document.getElementById('pwNew').value;
  const newPw2 = document.getElementById('pwNew2').value;
  if (!current || !newPw) { toast('Fill all password fields.', 'error'); return; }
  if (newPw.length < 8) { toast('New password must be at least 8 characters.', 'error'); return; }
  if (newPw !== newPw2) { toast('New passwords do not match.', 'error'); return; }
  const ok = await verifyPassword(current, state.currentUser.passwordHash, state.currentUser.passwordSalt, state.currentUser.passwordIterations);
  if (!ok) { toast('Current password is incorrect.', 'error'); return; }
  const { hash, salt, iterations } = await hashPassword(newPw);
  state.currentUser.passwordHash = hash;
  state.currentUser.passwordSalt = salt;
  state.currentUser.passwordIterations = iterations;
  state.currentUser.updatedAt = now();
  await idbPut('users', state.currentUser);
  await logActivity('password_change', 'Teacher changed password');
  toast('Password changed successfully.', 'success');
}

async function startExam(examId) {
  const exam = await idbGet('examinations', examId);
  if (!exam || exam.status !== 'published') { toast('Examination not available.', 'error'); return; }

  // Check for existing attempt
  const existing = (await idbGetAllByIndex('attempts', 'studentExam', [state.currentUser.id, examId]))
    .find(a => a.status === 'in_progress' || a.status === 'submitted' || a.status === 'graded');

  if (existing && (existing.status === 'submitted' || existing.status === 'graded')) {
    toast('You have already submitted this examination.', 'warning');
    return;
  }

  let attempt = existing;
  if (!attempt) {
    // New attempt
    const allQ = await idbGetAll('questions');
    const qMap = Object.fromEntries(allQ.map(q => [q.id, q]));
    // Order by subject (fixed subject sequence); optional shuffle within each subject
    let questionIds = orderQuestionIdsBySubject(exam.questionIds || [], qMap, exam.randomiseQuestions !== false);
    const questions = questionIds.map(qid => {
      const q = qMap[qid];
      if (!q) return null;
      let options = [...q.options];
      let optionMap = [0, 1, 2, 3];
      if (exam.randomiseOptions) {
        const indices = [0, 1, 2, 3];
        const shuffled = shuffle(indices);
        options = shuffled.map(i => q.options[i]);
        optionMap = shuffled;
      }
      return {
        id: q.id,
        text: q.text,
        options,
        optionMap,
        marks: q.marks,
        subject: q.subject || 'Other'
      };
    }).filter(Boolean);

    attempt = {
      id: uid(),
      studentId: state.currentUser.id,
      admissionNumber: state.currentUser.admissionNumber,
      studentName: state.currentUser.fullName,
      examId: exam.id,
      examTitle: exam.title,
      questionOrder: questions.map(q => q.id),
      optionMaps: Object.fromEntries(questions.map(q => [q.id, q.optionMap])),
      answers: {},
      status: 'in_progress',
      startTime: now(),
      durationMinutes: exam.durationMinutes,
      deadline: new Date(Date.now() + exam.durationMinutes * 60 * 1000).toISOString(),
      allowBack: exam.allowBack !== false,
      createdAt: now(),
      updatedAt: now()
    };
    await idbPut('attempts', attempt);
  }

  // Load questions for display
  const allQ = await idbGetAll('questions');
  const qMap = Object.fromEntries(allQ.map(q => [q.id, q]));
  const questions = (attempt.questionOrder || exam.questionIds).map(qid => {
    const q = qMap[qid];
    if (!q) return null;
    const optionMap = attempt.optionMaps?.[qid] || [0, 1, 2, 3];
    return {
      id: q.id,
      text: q.text,
      options: optionMap.map(i => q.options[i]),
      optionMap,
      marks: q.marks,
      subject: q.subject || 'Other'
    };
  }).filter(Boolean);

  state.examAttempt = attempt;
  state.examQuestions = questions;
  state.examAnswers = { ...(attempt.answers || {}) };
  state.examFlags = new Set();
  state.currentQIndex = 0;
  state.view = 'exam';
  render();
  startExamTimer();
}

function orderQuestionIdsBySubject(ids, qMap, randomiseWithin) {
  const buckets = {};
  DEFAULT_SUBJECTS.forEach(s => { buckets[s] = []; });
  buckets['Other'] = [];
  (ids || []).forEach(qid => {
    const q = qMap[qid];
    if (!q) return;
    const s = DEFAULT_SUBJECTS.includes(q.subject) ? q.subject : 'Other';
    buckets[s].push(qid);
  });
  let ordered = [];
  DEFAULT_SUBJECTS.concat(['Other']).forEach(s => {
    let list = buckets[s] || [];
    if (randomiseWithin) list = shuffle(list);
    ordered = ordered.concat(list);
  });
  return ordered;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startExamTimer() {
  if (state.examTimerInterval) clearInterval(state.examTimerInterval);
  state.examTimerInterval = setInterval(() => {
    updateTimerDisplay();
    const deadline = new Date(state.examAttempt.deadline).getTime();
    if (Date.now() >= deadline) {
      clearInterval(state.examTimerInterval);
      autoSubmitExam(true);
    }
  }, 1000);
  updateTimerDisplay();
}

function updateTimerDisplay() {
  const el = document.getElementById('examTimer');
  if (!el || !state.examAttempt) return;
  const remaining = Math.max(0, new Date(state.examAttempt.deadline).getTime() - Date.now());
  const mins = Math.floor(remaining / 60000);
  const secs = Math.floor((remaining % 60000) / 1000);
  el.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
  el.classList.remove('warning', 'danger');
  if (remaining < 60000) el.classList.add('danger');
  else if (remaining < 300000) el.classList.add('warning');
}

function renderExamScreen() {
  const attempt = state.examAttempt;
  const questions = state.examQuestions;
  const idx = state.currentQIndex;
  const q = questions[idx];
  if (!q) return `<div class="empty-state"><p>No questions loaded.</p></div>`;

  const answeredCount = Object.keys(state.examAnswers).length;
  const pct = Math.round((answeredCount / questions.length) * 100);
  const selectedDisplay = state.examAnswers[q.id];
  const optionMap = q.optionMap || [0, 1, 2, 3];
  const displaySelected = selectedDisplay !== undefined ? optionMap.indexOf(selectedDisplay) : -1;
  const isFlagged = state.examFlags.has(q.id);

  return `
    <div class="exam-screen">
      <div class="exam-header">
        <div class="student-info">
          <strong>${escapeHtml(attempt.studentName)}</strong> · ${escapeHtml(attempt.admissionNumber)}<br>
          <span style="opacity:0.8">${escapeHtml(attempt.examTitle)}</span>
        </div>
        <div class="timer" id="examTimer">--:--</div>
      </div>
      <div class="exam-body">
        <div class="exam-question-panel">
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">
            <div class="q-number" style="margin:0">Question ${idx + 1} of ${questions.length} · ${pct}% complete
              <span class="badge badge-teal" style="margin-left:8px">${escapeHtml(q.subject || 'General')}</span>
            </div>
            <button class="flag-btn ${isFlagged ? 'flagged' : ''}" onclick="toggleExamFlag('${q.id}')">${isFlagged ? '🚩 Unflag' : '🚩 Flag'}</button>
          </div>
          <div class="q-text">${escapeHtml(q.text)}</div>
          <div class="option-list">
            ${q.options.map((opt, i) => `
              <div class="option-item ${displaySelected === i ? 'selected' : ''}" onclick="selectAnswer(${i})" role="button" tabindex="0">
                <span class="opt-letter">${String.fromCharCode(65 + i)}</span>
                <span>${escapeHtml(opt)}</span>
              </div>
            `).join('')}
          </div>
          <div class="exam-actions">
            ${attempt.allowBack && idx > 0 ? `<button class="btn btn-outline" onclick="navQuestion(-1)">← Previous</button>` : ''}
            ${idx < questions.length - 1 ? `<button class="btn btn-primary" onclick="navQuestion(1)">Next →</button>` : ''}
            <button class="btn btn-teal" onclick="showReviewScreen()">Review & Submit</button>
          </div>
        </div>
        <div class="exam-nav-panel">
          <div class="exam-progress">${answeredCount} of ${questions.length} answered</div>
          <h4>Questions</h4>
          <div class="q-nav-grid">
            ${questions.map((qq, i) => `
              <button class="q-nav-btn ${i === idx ? 'current' : ''} ${state.examAnswers[qq.id] !== undefined ? 'answered' : ''} ${state.examFlags.has(qq.id) ? 'flagged' : ''}"
                onclick="goToQuestion(${i})">${i + 1}</button>
            `).join('')}
          </div>
          <button class="btn btn-warning w-full btn-sm" onclick="showReviewScreen()">Review & Submit</button>
        </div>
      </div>
    </div>
  `;
}

function toggleExamFlag(qid) {
  if (state.examFlags.has(qid)) state.examFlags.delete(qid);
  else state.examFlags.add(qid);
  render();
  startExamTimer();
}

async function selectAnswer(displayIndex) {
  const q = state.examQuestions[state.currentQIndex];
  if (!q) return;
  const optionMap = q.optionMap || [0, 1, 2, 3];
  const originalIndex = optionMap[displayIndex];
  state.examAnswers[q.id] = originalIndex;
  // Autosave
  try {
    state.examAttempt.answers = { ...state.examAnswers };
    state.examAttempt.updatedAt = now();
    await idbPut('attempts', state.examAttempt);
  } catch (err) {
    toast('Failed to save answer. Check storage space.', 'error');
    console.error(err);
  }
  render();
  startExamTimer(); // re-bind timer display
}

function navQuestion(delta) {
  const next = state.currentQIndex + delta;
  if (next >= 0 && next < state.examQuestions.length) {
    state.currentQIndex = next;
    render();
    startExamTimer();
  }
}

function goToQuestion(i) {
  state.currentQIndex = i;
  render();
  startExamTimer();
}

function showReviewScreen() {
  const questions = state.examQuestions;
  const answered = Object.keys(state.examAnswers).length;
  showModal('Review Before Submission', `
    <p class="mb-2">You have answered <strong>${answered}</strong> of <strong>${questions.length}</strong> questions.</p>
    <ul class="review-list">
      ${questions.map((q, i) => `
        <li>
          <span>Q${i + 1}: ${state.examAnswers[q.id] !== undefined ? '<span class="text-success">Answered</span>' : '<span class="text-danger">Not answered</span>'}</span>
          <button class="btn btn-sm btn-outline" onclick="closeModal();goToQuestion(${i})">Go</button>
        </li>
      `).join('')}
    </ul>
    <p class="mt-2 text-sm text-muted">Once submitted, you cannot change your answers.</p>
  `, [
    { label: 'Continue Exam', class: 'btn-outline', onClick: closeModal },
    { label: 'Submit Examination', class: 'btn-danger', onClick: () => { closeModal(); submitExam(false); } }
  ]);
}

async function submitExam(timeExpired) {
  if (state.examTimerInterval) clearInterval(state.examTimerInterval);
  state.examAttempt.answers = { ...state.examAnswers };
  state.examAttempt.status = 'submitted';
  state.examAttempt.submitTime = now();
  state.examAttempt.timeExpired = !!timeExpired;
  state.examAttempt.updatedAt = now();
  try {
    await idbPut('attempts', state.examAttempt);
    toast(timeExpired ? 'Time expired. Your answers have been submitted.' : 'Examination submitted successfully.', 'success');
  } catch (err) {
    toast('Submission save failed: ' + err.message, 'error');
    return;
  }
  state.view = 'studentHome';
  state.examAttempt = null;
  state.examQuestions = [];
  state.examAnswers = {};
  render();
  loadStudentHome();
}

async function autoSubmitExam(timeExpired) {
  await submitExam(timeExpired);
}

// -------------------- Post-render loaders --------------------
const viewLoaders = {
  dashboard: loadDashboard,
  students: loadStudents,
  questions: loadQuestions,
  exams: loadExams,
  results: loadResults,
  analytics: loadAnalytics,
  ranks: loadRanks,
  remarks: loadRemarks,
  settings: loadSettings,
  activity: loadActivity,
  studentHome: loadStudentHome
};

const originalRender = render;
render = function() {
  originalRender();
  const loader = viewLoaders[state.view];
  if (loader) setTimeout(loader, 0);
  if (state.view === 'exam') setTimeout(startExamTimer, 0);
};

// -------------------- Boot --------------------
async function boot() {
  try {
    applyTheme();
    state.currentUser = null;
    state.role = null;
    state.view = 'login';
    await openDB();
    // Remove plaintext credentials persisted by older builds.
    for (const store of ['users', 'students']) {
      const records = await idbGetAll(store);
      for (const record of records || []) {
        if (Object.prototype.hasOwnProperty.call(record, 'passwordPlain')) {
          delete record.passwordPlain;
          await idbPut(store, record);
        }
      }
    }
    // Ensure school logo/motto present for existing installations
    try {
      const st = await idbGet('settings', 'school');
      if (st && (!st.schoolLogo || !st.schoolMotto)) {
        if (!st.schoolLogo) st.schoolLogo = DEFAULT_SCHOOL_LOGO;
        if (!st.schoolMotto) st.schoolMotto = 'IN GOD WE TRUST';
        st.updatedAt = now();
        await idbPut('settings', st);
      }
    } catch (e) { /* ignore */ }
    // First-run: force administrator account creation when no teacher exists
    const users = await idbGetAll('users');
    const teachers = (users || []).filter(u => u.role === 'teacher');
    if (!teachers.length) {
      // Show setup immediately — do not show login until admin exists
      document.getElementById('app').innerHTML = renderAuthShell(getSetupFormHtml());
      return;
    }
    // Normal login
    render();
    showLoginForm();
  } catch (err) {
    console.error(err);
    document.getElementById('app').innerHTML = `
      <div class="auth-screen">
        <div class="auth-card">
          <h1 style="color:var(--danger)">Storage Error</h1>
          <p class="mt-2">Could not open the local database. IndexedDB may be blocked.</p>
          <p class="text-sm text-muted mt-1">${escapeHtml(err.message)}</p>
          <p class="text-sm mt-2">Try opening this file in Chrome or Edge. If using the file:// protocol, some browsers restrict IndexedDB. Consider serving the file via a local HTTP server.</p>
        </div>
      </div>
    `;
  }
}

  downloadStudentTemplate, showImportStudents, previewStudentImport, doStudentImport, exportStudentsCSV, clearAllStudents, clearAllQuestions,
  showQuestionForm, showBulkAddQuestions, previewBulkQuestions, saveBulkQuestions, saveQuestion, duplicateQuestion, toggleQuestionStatus, deleteQuestion,
  renameQuestionGroup, publishQuestionGroup,
  showImportQuestions, downloadQuestionTemplate, downloadQuestionDocxTemplate, previewQuestionImport, doQuestionImport, toggleSubjectSection, bulkPublishSubject, bulkUnpublishSubject, applySubjectDeptWeights, matchSubjectFromText,
  showExamForm, examSelectSubject, updateExamSubjectCounts, saveExam, toggleExamStatus, showAutoMarkingGuide, manageAnswerKey, saveAnswerKey, printAnswerKey, generatePdfAnswerKey, exportStudentExamPackage,
  exportRosterPackage, importRosterPackage, importExamPackage, exportAllResponses, importResponseFiles,
  createFullBackup, restoreFromBackup,
  showResultDetail, showPlacementOverride, exportResultsCSV, printResultSlip,
  printAnalyticsReport, printPlacementList, printClassResults, printRanks,
  showNewRemarkForm, resolveRemark, viewRemark,
  saveSettings, clearSchoolLogo, changeTeacherPassword,
  startExam, selectAnswer, navQuestion, goToQuestion, showReviewScreen, submitExam, closeModal, toggleExamFlag, toggleTheme, printResultSlip
});

boot();
</script>
