name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'          # Runs when you create a tag like v1.0
  workflow_dispatch:  # Allows manual run from GitHub website

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "SS1_Placement_Test" `
            --add-data "database.py;." `
            --hidden-import=customtkinter `
            --hidden-import=tkinter `
            --collect-all customtkinter `
            app.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SS1_Placement_Test_Windows
          path: dist/SS1_Placement_Test.exe

      - name: Create GitHub Release (only on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SS1_Placement_Test.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
