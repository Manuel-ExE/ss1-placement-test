name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "SS1_Placement_Test" `
            --add-data "database.py;." `
            --hidden-import=customtkinter `
            --hidden-import=tkinter `
            --collect-all customtkinter `
            app.py

      - name: Download Inno Setup
        run: |
          choco install innosetup -y --no-progress
        shell: pwsh

      - name: Compile Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
        shell: pwsh

      - name: Upload Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: SS1_Placement_Test_Setup
          path: installer_output/SS1_Placement_Test_Setup.exe
          if-no-files-found: error

      - name: Upload portable EXE (backup)
        uses: actions/upload-artifact@v4
        with:
          name: SS1_Placement_Test_Portable
          path: dist/SS1_Placement_Test.exe

      - name: Create GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer_output/SS1_Placement_Test_Setup.exe
            dist/SS1_Placement_Test.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
